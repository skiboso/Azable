services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: azable
      POSTGRES_PASSWORD: azable
      POSTGRES_DB: azable
    ports:
      - "5432:5432"
    volumes:
      - azable_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U azable"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./services/backend
    environment:
      DATABASE_URL: postgresql://azable:azable@postgres:5432/azable
      BIND_ADDR: 0.0.0.0:8080
      SOROBAN_RPC_URL: ${SOROBAN_RPC_URL:-https://soroban-testnet.stellar.org}
      NETWORK_PASSPHRASE: ${NETWORK_PASSPHRASE:-Test SDF Network ; September 2015}
      CONTRACT_IDS: ${CONTRACT_IDS:-}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  azable_postgres_data:
